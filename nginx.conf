server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The JS bundle is ~5 MB of text and blocks first paint; uncompressed it was
    # the whole of a 1.8s boot. gzip_proxied is required — traefik terminates TLS
    # in front, so without it nginx skips compression on every proxied request.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Service worker — never cache; browser must always check for updates.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # SPA HTML entry — never cache so users always pick up new hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types has no .mjs mapping → ES module scripts
    # (e.g. pdf.js's pdf.worker.min.mjs) would be served as
    # application/octet-stream and rejected under strict MIME checking.
    # Force the correct type here. Matched before the generic static rule.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
